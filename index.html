<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Статистика проектов</title>
  <meta name="description" content="Понятная статистика проектов из Яндекс.Метрики.">
  <meta name="theme-color" content="#0c66f0">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Rubik+Bubbles&family=Unbounded:wght@700;800;900&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="ghost-word" data-speed=".22">TanWin</span>
    <span class="ghost-word g2" data-speed=".34">123</span>
    <i class="splat s1" data-speed=".12"></i>
    <i class="splat s2" data-speed=".4"></i>
    <i class="splat s3" data-speed=".26"></i>
  </div>
  <header class="top" id="top">
    <div class="brand">
      <img src="icons/icon-192.png" alt="" width="54" height="54">
      <div class="brand-text">
        <div class="title-row">
          <h1 class="kin" id="title">Статистика</h1>
          <button class="proj" id="proj" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="projMenu" hidden>
            <span class="proj-name" id="projName">TanWin</span>
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <p class="updated" id="updated"></p>
      </div>
    </div>
    <div class="proj-menu" id="projMenu" hidden></div>
    <div class="top-actions" id="topActions" hidden>
      <div class="periods" role="tablist" aria-label="Период" id="periods"></div>
      <button class="icon-btn" id="refresh" type="button" aria-label="Обновить">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>

  <div class="tip" id="tip" role="tooltip" hidden></div>
  <script src="js/app.js"></script>
</body>
</html>
