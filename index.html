<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Статистика TanWin</title>
  <meta name="description" content="Понятная статистика приложения TanWin из Яндекс.Метрики.">
  <meta name="theme-color" content="#0a0f1f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icons/icon-192.png" alt="" width="40" height="40">
      <div>
        <h1>Статистика TanWin</h1>
        <p class="updated" id="updated"></p>
      </div>
    </div>
    <div class="top-actions" id="topActions" hidden>
      <div class="periods" role="tablist" aria-label="Период" id="periods"></div>
      <button class="icon-btn" id="refresh" type="button" aria-label="Обновить">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>

  <div class="tip" id="tip" role="tooltip" hidden></div>
  <script src="js/app.js"></script>
</body>
</html>
